<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Circular Wavy Progress — geometry engine test</title>
    <script type="importmap">
      {
        "imports": {
          "tslib": "./node_modules/tslib/tslib.es6.mjs"
        }
      }
    </script>
    <style>
      html { touch-action: manipulation; }
      :root {
        --primary: #6750a4;
        --track: #e8def8;
      }
      body {
        margin: 24px;
        font: 13px system-ui, sans-serif;
        background: #fef7ff;
        color: #1d1b20;
        max-width: 1000px;
      }
      h2 {
        font-size: 16px;
      }
      h3 {
        font-size: 13px;
        margin: 4px 0 8px;
        color: #49454f;
      }
      .row {
        display: flex;
        gap: 28px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin: 16px 0 26px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      svg {
        overflow: visible;
      }
      svg path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .track {
        stroke: var(--track);
      }
      .active {
        stroke: var(--primary);
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-right: 18px;
      }
      input[type="range"] {
        width: 220px;
      }
      button {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid #79747e;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      code {
        background: #ece6f0;
        padding: 1px 4px;
        border-radius: 4px;
      }
      .panel {
        border: 1px solid #e7e0ec;
        border-radius: 12px;
        padding: 16px 18px;
        margin: 18px 0;
      }
      .hint {
        color: #79747e;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Circular Wavy Progress — 几何引擎测试</h2>
    <p class="hint">
      纯函数 <code>generateCircularWavyPath(progress, morphAmplitude)</code> 生成描边路径；等宽由 stroke 保证。
    </p>

    <div class="panel">
      <h3>确定态 · 不同 progress × morphAmplitude（48px 默认）</h3>
      <div class="row" id="staticGrid"></div>
    </div>

    <div class="panel">
      <h3>确定态 · 交互（拖动进度，观察波幅 10%↔95% 收平 & 波浪流动）</h3>
      <div class="row">
        <label>进度 <input id="p" type="range" min="0" max="1" step="0.001" value="0.5" /><span id="pv">0.50</span></label>
        <label><input id="slow" type="checkbox" />慢放 ×0.25</label>
        <button id="sim">模拟加载 0→100%</button>
      </div>
      <div class="row">
        <div class="cell"><div data-interactive="1"></div>48px</div>
        <div class="cell"><div data-interactive="1" data-size="96" data-stroke="8" data-gap="8" data-wavelength="30"></div>×2</div>
        <div class="cell"><div data-interactive="1" data-size="192" data-stroke="16" data-gap="16" data-wavelength="60"></div>×4</div>
      </div>
    </div>

    <div class="panel">
      <h3>不确定态 · 三段动画（global 6s 自转 + 每 1.5s 补 +90° + sweep 0.1↔0.87 呼吸）</h3>
      <div class="row">
        <div class="cell"><div data-indeterminate="1"></div>48px</div>
        <div class="cell"><div data-indeterminate="1" data-size="96" data-stroke="8" data-gap="8" data-wavelength="30"></div>×2</div>
        <div class="cell"><div data-indeterminate="1" data-size="192" data-stroke="16" data-gap="16" data-wavelength="60"></div>×4</div>
      </div>
    </div>

    <script type="module">
      import {
        generateCircularWavyPath,
        determinateAmplitude,
        indeterminateState,
        easeStandard,
        easeEmphasizedAccelerate,
      } from "./packages/web/dist/geometry.js";

      const NS = "http://www.w3.org/2000/svg";
      const starCache = new Map();

      function makeSvg(root, size, stroke, trackStroke) {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("width", size);
        svg.setAttribute("height", size);
        svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
        const track = document.createElementNS(NS, "path");
        track.setAttribute("class", "track");
        track.setAttribute("stroke-width", trackStroke);
        const active = document.createElementNS(NS, "path");
        active.setAttribute("class", "active");
        active.setAttribute("stroke-width", stroke);
        svg.append(track, active);
        root.append(svg);
        return { svg, track, active };
      }

      function paint(handles, { active, track }) {
        handles.active.setAttribute("d", active);
        handles.track.setAttribute("d", track);
      }

      // ── Static grid: rows = progress, cols = amplitude ──
      const grid = document.getElementById("staticGrid");
      const progresses = [0, 0.05, 0.1, 0.3, 0.5, 0.8, 0.95, 1];
      const amplitudes = [0, 0.5, 1];
      for (const amp of amplitudes) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const holder = document.createElement("div");
        const h = makeSvg(holder, 48, 4, 4);
        const paths = generateCircularWavyPath(0.5, amp, { size: 48, stroke: 4, trackStroke: 4, gap: 4, wavelength: 15 }, 0, 0, starCache);
        paint(h, paths);
        cell.append(holder, document.createTextNode(`amp=${amp}`));
        grid.append(cell);
      }
      // Second row of the grid: vary progress at amp=1
      const rowWrap = document.createElement("div");
      rowWrap.style.display = "flex";
      rowWrap.style.gap = "20px";
      for (const p of progresses) {
        const cell = document.createElement("div");
        cell.className = "cell";
        const holder = document.createElement("div");
        const h = makeSvg(holder, 48, 4, 4);
        const paths = generateCircularWavyPath(p, determinateAmplitude(p), { size: 48, stroke: 4, trackStroke: 4, gap: 4, wavelength: 15 }, 0, 0, starCache);
        paint(h, paths);
        cell.append(holder, document.createTextNode(`p=${p}`));
        rowWrap.append(cell);
      }
      grid.append(rowWrap);

      // ── Interactive ──
      window.__scale = 1;
      document.getElementById("slow").addEventListener("change", (e) => {
        window.__scale = e.target.checked ? 0.25 : 1;
      });
      const range = document.getElementById("p");
      const pv = document.getElementById("pv");
      range.value = "0.5";
      pv.textContent = "0.50";

      const interactive = [];
      document.querySelectorAll('[data-interactive="1"]').forEach((root) => {
        const size = +(root.dataset.size || 48);
        const stroke = +(root.dataset.stroke || 4);
        const gap = +(root.dataset.gap || 4);
        const wavelength = +(root.dataset.wavelength || 15);
        const h = makeSvg(root, size, stroke, stroke);
        interactive.push({ h, size, stroke, gap, wavelength, amp: null, ampAnim: null, offset: 0, progress: 0.5 });
      });

      let simOn = false;
      let simTimer = null;
      range.addEventListener("input", () => {
        simOn = false;
        if (simTimer) clearTimeout(simTimer);
        const v = +range.value;
        pv.textContent = v.toFixed(2);
        for (const it of interactive) it.progress = v;
      });
      document.getElementById("sim").addEventListener("click", () => {
        simOn = true;
        let target = 0;
        range.value = "0";
        pv.textContent = "0.00";
        for (const it of interactive) it.progress = 0;
        const step = () => {
          if (!simOn) return;
          if (target >= 1) return;
          const from = +range.value;
          target = Math.min(1, target + 0.05 + Math.random() * 0.12);
          const t0 = performance.now();
          const tick = (now) => {
            if (!simOn) return;
            const k = Math.min(1, ((now - t0) * window.__scale) / 500);
            const v = from + (target - from) * k;
            range.value = v;
            pv.textContent = (+v).toFixed(2);
            for (const it of interactive) it.progress = v;
            if (k < 1) requestAnimationFrame(tick);
            else simTimer = setTimeout(step, 700 / window.__scale);
          };
          requestAnimationFrame(tick);
        };
        simTimer = setTimeout(step, 300);
      });

      // ── Indeterminate ──
      const indeterminate = [];
      document.querySelectorAll('[data-indeterminate="1"]').forEach((root) => {
        const size = +(root.dataset.size || 48);
        const stroke = +(root.dataset.stroke || 4);
        const gap = +(root.dataset.gap || 4);
        const wavelength = +(root.dataset.wavelength || 15);
        const h = makeSvg(root, size, stroke, stroke);
        indeterminate.push({ h, size, stroke, gap, wavelength });
      });

      // ── Animation loop ──
      let last = performance.now();
      let clock = 0;
      for (const it of interactive) {
        const amp0 = determinateAmplitude(it.progress);
        it.amp = amp0;
      }
      function frame(now) {
        const dt = Math.min(64, Math.max(0, now - last)) * window.__scale;
        last = now;
        clock += dt;

        // interactive determinate
        for (const it of interactive) {
          const target = determinateAmplitude(it.progress);
          if (it.amp === null) it.amp = target;
          if (it.ampAnim) {
            const k = Math.min(1, (it.ampAnim.elapsed) / 500);
            it.amp = it.ampAnim.from + (it.ampAnim.to - it.ampAnim.from) * it.ampAnim.ease(k);
            it.ampAnim.elapsed += dt;
            if (k >= 1) it.ampAnim = null;
          } else if (Math.abs(target - it.amp) > 1e-6) {
            it.ampAnim = { from: it.amp, to: target, elapsed: 0, ease: it.amp < target ? easeStandard : easeEmphasizedAccelerate };
          }
          const n = Math.max(5, Math.round((2 * Math.PI * (it.size / 2 - it.stroke / 2)) / it.wavelength));
          if (it.amp > 0 || it.ampAnim) it.offset = (it.offset + dt / (n * 1000)) % 1;
          const waveOffset = it.amp > 0 ? it.offset : 0;
          const paths = generateCircularWavyPath(it.progress, it.amp, { size: it.size, stroke: it.stroke, trackStroke: it.stroke, gap: it.gap, wavelength: it.wavelength }, waveOffset, 0, starCache);
          paint(it.h, paths);
        }

        // indeterminate
        for (const it of indeterminate) {
          const st = indeterminateState(clock);
          const n = Math.max(5, Math.round((2 * Math.PI * (it.size / 2 - it.stroke / 2)) / it.wavelength));
          it.offset = ((it.offset || 0) + dt / (n * 1000)) % 1;
          const paths = generateCircularWavyPath(st.sweep, st.amplitude, { size: it.size, stroke: it.stroke, trackStroke: it.stroke, gap: it.gap, wavelength: it.wavelength }, it.offset, st.rotationDeg, starCache);
          paint(it.h, paths);
        }

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
